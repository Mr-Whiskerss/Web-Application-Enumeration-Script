# WebRecon Stealth Configuration
#
# Slow, quiet scanning. Avoids detection, respects rate limits, skips intrusive checks.
# Use: python3 web_app.py -t example.com -C configs/config.stealth.yaml

scanning:
  threads: 2
  timeout: 15
  rate: 10
  delay: 1.0
  full_ports: false
  verbose: false

tools:
  nmap_timeout: 600
  whatweb_timeout: 180
  arjun_timeout: 1800
  nuclei_timeout: 1800

reporting:
  format: html
  include_findings_by_severity: [CRITICAL, HIGH, MEDIUM]
  html_theme: dark

# Intrusive checks disabled by default in stealth mode
# Avoids:
# - Nikto scan
# - Default credential testing
# - HTTP PUT/DELETE testing
# - Time-based SQLi confirmation
# - Request smuggling probes
