[pytest]
# Pytest configuration for web_app tests

# Minimum version
minversion = 6.0

# Test discovery patterns
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Output options
addopts =
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    -ra

# Markers for test categorization
markers =
    unit: Unit tests for individual modules
    integration: Integration tests combining multiple modules
    slow: Tests that take significant time to run
    mock_network: Tests that mock network calls
    thread_safety: Tests for thread safety and concurrency

# Coverage options (if pytest-cov is installed)
# addopts = --cov=web_app --cov-report=html --cov-report=term-missing

# Timeout for tests (if pytest-timeout is installed)
# timeout = 300

# Log settings
log_cli = false
log_cli_level = INFO
log_file = test_results.log
log_file_level = DEBUG
